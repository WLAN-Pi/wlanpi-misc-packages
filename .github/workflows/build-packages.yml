name: Build and release misc packages

on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to build
        required: true
        type: choice
        options:
          - all
          - iw
          - wlanpi-linux-firmware
          - iperf
          - iperf3
          - wavemon
          - wpasupplicant
          - hostapd
        default: all

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  matrix-prep:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.packages }}" = "all" ]; then
            echo 'matrix={"package": ["iw", "wlanpi-linux-firmware", "iperf", "iperf3", "wavemon", "wpasupplicant", "hostapd"], "distro": ["trixie"], "arch": ["arm64"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"package": ["${{ github.event.inputs.packages }}"], "distro": ["trixie"], "arch": ["arm64"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix-prep
    name: Build package ${{ matrix.package }}+${{ matrix.distro }}+${{ matrix.arch }}
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix-prep.outputs.matrix)}}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 0E98404D386FA1D9
          sudo apt-get update -yqq
          sudo apt-get install -yqq --no-install-recommends \
                git bc bison flex libssl-dev make libc6-dev libncurses5-dev devscripts \
                libdistro-info-perl
          sudo apt-get install -yqq --no-install-recommends \
                crossbuild-essential-armhf crossbuild-essential-arm64

      - name: Build package ${{ matrix.package }}
        id: build-package
        run: |
          ./package.sh --arch=${{ matrix.arch }} --package=${{ matrix.package }} --distro=${{ matrix.distro }}

      - name: Check debootstrap logs
        if: failure()
        run: |
          for distro in trixie; do
            logfile="/srv/chroot/${distro}-${{ matrix.arch }}-sbuild/debootstrap/debootstrap.log"
            if [ -f "$logfile" ]; then
              echo "=== $distro logs ==="
              cat "$logfile"
            fi
          done

      - name: Upload debootstrap logs 
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debootstrap-${{ matrix.package }}-${{ matrix.distro }}-${{ matrix.arch }}-logs
          path: /srv/chroot/${{ matrix.distro }}-${{ matrix.arch }}-sbuild/debootstrap/debootstrap.log

      - name: Upload package ${{ matrix.package }} to GitHub
        uses: actions/upload-artifact@v7
        if: ${{ steps.build-package.outputs.deb-package != '' }}
        with:
          name: ${{ matrix.package }}-${{ matrix.arch }}-${{ matrix.distro }}-${{ steps.build-package.outputs.artifact-version }}
          path: ${{ steps.build-package.outputs.deb-package }}

      # Push with the package_cloud CLI directly instead of an action so upload
      # errors are detected: the CLI exits 0 even when a push fails (Thor bug),
      # which has produced green runs that uploaded nothing.
      - name: Upload package to packagecloud ${{ matrix.distro }}
        if: ${{ matrix.arch == 'arm64' && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          DEB_PACKAGE: ${{ steps.build-package.outputs.deb-package }}
        run: |
          if [ -z "${DEB_PACKAGE}" ]; then
            echo "::error::no .deb package to upload"
            exit 1
          fi
          case "${{ matrix.arch }}" in
            armhf) target="wlanpi/dev/raspbian/${{ matrix.distro }}" ;;
            *)     target="wlanpi/dev/debian/${{ matrix.distro }}" ;;
          esac
          sudo gem install package_cloud
          echo "Pushing ${DEB_PACKAGE} to ${target}"
          out=$(package_cloud push "${target}" "${DEB_PACKAGE}" 2>&1) || true
          echo "${out}"
          echo "${out}" | grep -q "success!"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ steps.build-package.outputs.deb-package != '' && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: debians
          branch: update-changelog
          branch-suffix: timestamp
          delete-branch: true
          title: Update changelog for ${{ matrix.package }} version ${{ steps.build-package.outputs.package-version }}
          body: Package ${{ matrix.package }} built on version ${{ steps.build-package.outputs.package-version }}.
          assignees: joshschmelzle

  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to Slack
    needs:
      - build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@2e709ce51fd47f02b7221db8547e6e6f49f81f1d # v2.0.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
